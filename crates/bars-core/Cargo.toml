[package]
name = "bars-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
dirs = "6"
parking_lot = "0.12"
crossbeam-channel = "0.5"
async-channel = "2"
bitflags = { version = "2", features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
once_cell = "1"
cpal = { version = "0.18", features = ["pulseaudio"] }
# platform-verifier: trust the OS certificate store (like browsers do), so
# downloads work behind TLS-inspecting proxies and antivirus whose root
# certificates are installed system-wide.
ureq = { version = "3", default-features = false, features = ["rustls", "gzip", "platform-verifier"] }
sha2 = "0.10"
semver = "1"
transcribe-rs = { version = "0.3.12", features = ["onnx"] }
# Polish (Spokenly Cleanup 1) runs on llama.cpp, on the CPU (see
# .cargo/config.toml). No OpenMP, so nothing extra to ship.
llama-cpp-2 = { version = "0.1.159", default-features = false }
llama-cpp-sys-2 = { version = "0.1.159", default-features = false }

[dev-dependencies]
env_logger = "0.11"

[target.'cfg(target_os = "linux")'.dependencies]
evdev = "0.13"
xkbcommon = { version = "0.9", default-features = false }
wl-clipboard-rs = "0.9"
ashpd = { version = "0.13", default-features = false, features = ["async-io", "global_shortcuts", "remote_desktop", "screencast"] }
async-io = "2"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }
nix = { version = "0.30", features = ["fs", "ioctl", "poll", "signal"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
# Muting other apps while dictating (cpal's PulseAudio client, used directly).
pulseaudio = "0.3"
# Installing updates: the release tarball or Flatpak bundle, checked with
# the updater key.
minisign-verify = "0.2"
base64 = "0.22"
flate2 = "1"
tar = "0.4"

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
enigo = "0.6"
# Installs updates on request (verifies the download, replaces the app).
cargo-packager-updater = "0.2"
arboard = { version = "3.6", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.25"
core-foundation = "0.10"
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSData", "NSArray", "NSObject", "NSValue"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "libc", "NSPasteboard", "NSPasteboardItem", "NSRunningApplication"] }
libc = "0.2"
objc2-av-foundation = { version = "0.3", features = ["AVCaptureDevice", "AVMediaFormat", "block2"] }
objc2-core-audio = { version = "0.3", default-features = false, features = ["std", "AudioHardware", "objc2", "objc2-foundation"] }
objc2-core-audio-types = { version = "0.3", default-features = false, features = ["std", "CoreAudioBaseTypes"] }

