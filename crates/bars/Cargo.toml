[package]
name = "bars"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Local, private voice dictation for every app."

[dependencies]
bars-core = { path = "../bars-core" }
gpui-kit = "0.7.1"
anyhow = "1"
log = "0.4"
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }
async-channel = "2"
chrono = "0.4"
parking_lot = "0.12"
smol = "2"
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3", default-features = false, features = ["blocking", "async-io"] }
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }
ashpd = { version = "0.13", default-features = false, features = ["async-io", "background"] }

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
tray-icon = "0.26"
interprocess = "2.4"
raw-window-handle = "0.6"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }

# Icon and version information in bars.exe (see build.rs).
[build-dependencies]
embed-resource = "3"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSGeometry", "NSArray"] }
objc2-app-kit = { version = "0.3", features = [
    "NSAppearance", "NSBezierPath", "NSColor", "NSEvent", "NSGraphics", "NSImage", "NSResponder", "NSScreen",
    "NSView", "NSVisualEffectView", "NSWindow",
] }

# Windows/macOS installers: `cargo packager --release -p bars --formats nsis`
# (or `app,dmg`). See .github/workflows/release.yml.
[package.metadata.packager]
product-name = "Bars"
identifier = "xyz.hink.Bars"
description = "Private, on-device voice dictation for every app"
authors = ["Chris Hinkley"]
publisher = "Chris Hinkley"
category = "Productivity"
license-file = "../../LICENSE"
# In the app's resources (macOS) and next to bars.exe (Windows).
resources = ["../../LICENSE", "../../THIRD_PARTY_NOTICES.txt"]
out-dir = "../../dist"
binaries-dir = "../../target/release"
binaries = [{ path = "bars", main = true }]
icons = [
    "../../packaging/linux/icons/32x32/xyz.hink.Bars.png",
    "../../packaging/linux/icons/128x128/xyz.hink.Bars.png",
    "../../packaging/linux/icons/256x256/xyz.hink.Bars.png",
    "../../packaging/linux/icons/512x512/xyz.hink.Bars.png",
]

[package.metadata.packager.nsis]
installer-icon = "../../packaging/windows/bars.ico"

[package.metadata.packager.macos]
minimum-system-version = "12.0"
info-plist-path = "../../packaging/macos/Info.plist"

# Installer window: 768x576 pt background (Retina TIFF built in CI from
# dmg-background.png + @2x), app on the left of the arrow, Applications right.
