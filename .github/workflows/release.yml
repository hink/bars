name: Release

# Actions > Release > Run workflow, with a version like v0.2.0, builds every
# platform and opens a draft release for that tag (created on this commit).
# Leave the version empty to only build the artifacts. Pushing a v* tag does
# the same as a run with that version.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag, e.g. v0.2.0 (empty = build only)"
        required: false
        default: ""
      only:
        description: "Build just one platform (no release is drafted)"
        type: choice
        options: [all, Linux, Windows, macOS]
        default: all

# Actions are pinned to commits, not tags: a tag can be moved, and these
# jobs hold the keys releases are signed with. Only the job that drafts the
# release may write to the repository.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # A release isn't drafted from a commit whose tests fail.
  test:
    name: Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config clang libclang-dev cmake libasound2-dev libfontconfig-dev libfreetype-dev \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev libx11-xcb-dev \
            libxcb1-dev libvulkan-dev libssl-dev libzstd-dev
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # the "stable" branch
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo test --workspace --locked

  flatpak:
    name: Linux (Flatpak, ${{ matrix.arch }})
    # x86_64 only for now. Arm64 builds on native runners worked (v0.2.0):
    # add { arch: aarch64, runner: ubuntu-24.04-arm } to bring them back.
    strategy:
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-24.04 }
    if: inputs.only == '' || inputs.only == 'all' || inputs.only == 'Linux'
    runs-on: ${{ matrix.runner }}
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-26.08
      options: --privileged
      # The release build (LTO, whole GPUI stack) can fill the runner's disk.
      # Steps run in this container, so preinstalled toolchains we don't use
      # are mounted in to be deleted from the host.
      volumes:
        - /usr/share/dotnet:/host/dotnet
        - /usr/local/lib/android:/host/android
        - /opt/ghc:/host/ghc
        - /opt/hostedtoolcache/CodeQL:/host/codeql
    steps:
      - name: Free disk space
        run: |
          df -h /__w
          rm -rf /host/dotnet/* /host/android/* /host/ghc/* /host/codeql/*
          df -h /__w
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # This build reinstalls itself from the release's bundle when asked
      # (crates/bars-core/src/update.rs); local builds don't.
      - name: Mark the build as the release Flatpak
        run: |
          sed -i 's/^  env:$/  env:\n    BARS_PACKAGE: flatpak/' packaging/flatpak/xyz.hink.Bars.yml
          grep -q '^    BARS_PACKAGE: flatpak$' packaging/flatpak/xyz.hink.Bars.yml
      - uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3 # v6.8
        with:
          manifest-path: packaging/flatpak/xyz.hink.Bars.yml
          arch: ${{ matrix.arch }}
          bundle: bars-${{ matrix.arch }}.flatpak
          cache-key: flatpak-builder-${{ matrix.arch }}-${{ github.sha }}
          upload-artifact: false
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-flatpak-${{ matrix.arch }}
          path: bars-${{ matrix.arch }}.flatpak

  linux-tarball:
    name: Linux (tarball, ${{ matrix.arch }})
    # The prebuilt ONNX Runtime needs glibc >= 2.38 / GCC 13 libstdc++, so
    # this tarball targets 2024+ distros. The Flatpak covers everything else.
    # x86_64 only for now (see the Flatpak job for arm64).
    strategy:
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-24.04 }
    if: inputs.only == '' || inputs.only == 'all' || inputs.only == 'Linux'
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config clang libclang-dev cmake libasound2-dev libfontconfig-dev libfreetype-dev \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev libx11-xcb-dev \
            libxcb1-dev libvulkan-dev libssl-dev libzstd-dev
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # the "stable" branch
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # This build replaces itself from the release's tarball when asked
      # (crates/bars-core/src/update.rs).
      - run: cargo build --release -p bars --locked
        env:
          BARS_PACKAGE: tarball
      - name: Package
        run: |
          dir=bars-linux-${{ matrix.arch }}
          mkdir -p $dir/share/applications $dir/share/metainfo $dir/udev
          install -Dm755 target/release/bars $dir/bin/bars
          cp packaging/linux/xyz.hink.Bars.desktop $dir/share/applications/
          cp packaging/linux/xyz.hink.Bars.metainfo.xml $dir/share/metainfo/
          cp -r packaging/linux/icons $dir/share/icons
          cp packaging/linux/70-bars.rules $dir/udev/
          cp README.md LICENSE THIRD_PARTY_NOTICES.txt $dir/
          tar czf $dir.tar.gz $dir
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-tarball-${{ matrix.arch }}
          path: bars-linux-${{ matrix.arch }}.tar.gz

  windows:
    name: Windows (installer, ${{ matrix.arch }})
    # x64 only for now. Arm64 worked on windows-11-arm (v0.2.0) with clang
    # installed for ring: add { arch: arm64, runner: windows-11-arm } and a
    # step that runs `choco install llvm` when clang is missing.
    strategy:
      matrix:
        include:
          - { arch: x64, runner: windows-latest }
    if: inputs.only == '' || inputs.only == 'all' || inputs.only == 'Windows'
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # the "stable" branch
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo install cargo-packager --locked --version 0.11.8
      - run: cargo build --release -p bars --locked
      - run: cargo packager --release -p bars --formats nsis
      # The in-app updater checks downloads against this signature.
      # Skipped without the key (forks).
      - name: Sign for the updater
        shell: bash
        env:
          BARS_UPDATER_KEY: ${{ secrets.UPDATER_PRIVATE_KEY }}
          BARS_UPDATER_KEY_PASSWORD: ${{ secrets.UPDATER_PRIVATE_KEY_PASSWORD }}
        run: |
          [ -n "$BARS_UPDATER_KEY" ] || exit 0
          for f in dist/*-setup.exe; do
            cargo packager signer sign -k "$BARS_UPDATER_KEY" --password "$BARS_UPDATER_KEY_PASSWORD" "$f"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-${{ matrix.arch }}
          path: |
            dist/*.exe
            dist/*.exe.sig

  # Apple Silicon only: ONNX Runtime no longer ships Intel Mac builds.
  macos:
    name: macOS (Apple Silicon)
    if: inputs.only == '' || inputs.only == 'all' || inputs.only == 'macOS'
    runs-on: macos-15
    # llama.cpp's bundled HTTP library (which Bars doesn't use) finds the
    # runner's Homebrew OpenSSL, then fails to configure against it.
    env:
      CMAKE_DISABLE_FIND_PACKAGE_OpenSSL: "ON"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # the "stable" branch
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo install cargo-packager --locked --version 0.11.8
      - run: cargo build --release -p bars --locked
      # Developer ID: macOS keeps Bars' permissions through updates. Skipped
      # without the secrets (forks), and the app is signed ad hoc.
      - name: Signing certificate
        env:
          P12: ${{ secrets.MACOS_DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_PASSWORD }}
        run: bash scripts/macos-signing-keychain.sh
      # Bars.app via cargo-packager (signed in the script), the DMG (with its
      # Finder layout) via dmgbuild, both notarized with the App Store
      # Connect API key, and the in-app updater's archive and signature.
      # Each step is skipped without its secrets.
      - run: bash scripts/package-macos.sh
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          BARS_UPDATER_KEY: ${{ secrets.UPDATER_PRIVATE_KEY }}
          BARS_UPDATER_KEY_PASSWORD: ${{ secrets.UPDATER_PRIVATE_KEY_PASSWORD }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos
          path: |
            dist/*.dmg
            dist/*.app.tar.gz
            dist/*.app.tar.gz.sig

  release:
    name: Draft release
    needs: [test, flatpak, linux-tarball, windows, macos]
    if: startsWith(github.ref, 'refs/tags/v') || (inputs.version != '' && (inputs.only == '' || inputs.only == 'all'))
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      # Read by the steps below as a variable, never pasted into a script.
      VERSION: ${{ inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts
          merge-multiple: true
      # The in-app updater checks Linux downloads against these signatures,
      # as macOS's and Windows' (signed in their jobs). Skipped without the
      # key (forks).
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # the "stable" branch
        with:
          toolchain: stable
      - name: Sign the Linux files for the updater
        env:
          BARS_UPDATER_KEY: ${{ secrets.UPDATER_PRIVATE_KEY }}
          BARS_UPDATER_KEY_PASSWORD: ${{ secrets.UPDATER_PRIVATE_KEY_PASSWORD }}
        run: |
          [ -n "$BARS_UPDATER_KEY" ] || exit 0
          cargo install cargo-packager --locked --version 0.11.8
          for f in artifacts/bars-linux-*.tar.gz artifacts/bars-*.flatpak; do
            cargo packager signer sign -k "$BARS_UPDATER_KEY" --password "$BARS_UPDATER_KEY_PASSWORD" "$f"
          done
      # What the in-app updater reads: releases/latest/download/latest.json.
      # A draft is never "latest", so publishing the release offers it.
      - run: python3 scripts/update-manifest.py "$VERSION" artifacts
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: Bars ${{ env.VERSION }}
          draft: true
          generate_release_notes: true
          files: artifacts/*
