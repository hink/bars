name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      platform:
        description: "Windows/macOS build + smoke test to run"
        type: choice
        options: [all, Windows, macOS]
        default: all

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux (test)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config clang libclang-dev cmake libasound2-dev libfontconfig-dev libfreetype-dev \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev libx11-xcb-dev \
            libxcb1-dev libvulkan-dev libssl-dev libzstd-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked
      - run: cargo build -p bars --locked

  # Windows/macOS minutes are billed at 2x/10x on private repos, so these
  # only run on demand: Actions > CI > Run workflow. Besides building, they
  # run the app (scripts/smoke) and upload screenshots and logs.
  check:
    name: ${{ matrix.name }} (build + smoke test)
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        name: [Windows, macOS]
        # (An `include` would add an excluded platform back, so the runner
        # and script are picked by name below.)
        exclude:
          - name: ${{ inputs.platform == 'Windows' && 'macOS' || (inputs.platform == 'macOS' && 'Windows' || 'none') }}
    runs-on: ${{ matrix.name == 'Windows' && 'windows-latest' || 'macos-15' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p bars --locked
      - name: Smoke test
        run: ${{ matrix.name == 'Windows' && 'pwsh scripts/smoke/windows.ps1' || 'bash scripts/smoke/macos.sh' }}
      - name: Disk image (macOS)
        if: matrix.name == 'macOS'
        run: |
          cargo install cargo-packager --locked --version 0.11.8
          bash scripts/smoke/macos-dmg.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-${{ matrix.name }}
          path: smoke/
          if-no-files-found: ignore
